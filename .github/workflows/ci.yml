name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: "Quality (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Lint (ruff)
        run: uv run ruff check src tests
      - name: Type check (mypy)
        run: uv run mypy src tests
      - name: Test (default, excludes real_binary/real_hardware)
        run: uv run pytest -v --tb=short

  smoke:
    name: "CPU Smoke (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --all-extras
      - name: Run smoke tests (wheel build, install, import, entry-point)
        run: uv run pytest tests/test_issue14.py -v -m smoke --tb=short -x

  release-gate:
    name: Release Gate
    needs: [quality, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check quality and smoke results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          if [[ "$QUALITY_RESULT" == "success" && "$SMOKE_RESULT" == "success" ]]; then
            echo "All release gates passed — smoke tests and quality checks are green."
          else
            echo "::error::Release gate failed — quality=$QUALITY_RESULT, smoke=$SMOKE_RESULT"
            exit 1
          fi
