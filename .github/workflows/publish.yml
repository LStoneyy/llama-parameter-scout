name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  pypi-publish:
    name: Upload to PyPI (trusted publishing)
    needs: [ci]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llama-parameter-scout
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build
        run: uv build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
