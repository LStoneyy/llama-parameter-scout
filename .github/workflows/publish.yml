name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build source and wheel
    needs: [ci]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Verify tag and version match
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          EXPECTED="v${VERSION}"
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag '$TAG' does not start with 'v'"
            exit 1
          fi
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Tag '$TAG' does not match project.version '$VERSION' (expected '$EXPECTED')"
            exit 1
          fi
          echo "Tag '$TAG' matches project.version '$VERSION'."
      - name: Verify commit is reachable from main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::Release commit is not an ancestor of origin/main - publishing blocked"
            exit 1
          }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Build
        run: uv build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pypi-publish:
    name: Upload to PyPI (trusted publishing)
    needs: [build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llama-parameter-scout
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true
