[project]
name = "llama-parameter-scout"
version = "0.1.0"
description = "Benchmark llama.cpp models across candidate configurations"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.0",
]

[project.scripts]
llama-parameter-scout = "llama_parameter_scout.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1",
    "ruff>=0.4",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_binary: tests that invoke a real llama-bench binary",
]
addopts = "-m 'not real_binary'"
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
